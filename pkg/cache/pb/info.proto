// Package cac.cache.v1 defines the Info gRPC service for cache-ctl.
// The service is registered alongside grpc_health_v1.Health on the
// cfg.HealthListen listener (same port, distinct service name). No
// new YAML config is required.
//
// The service exposes hits/misses/fills at the wire, tier, and EC-peer
// layers plus bounded Redis pool and backend-latency snapshots.
syntax = "proto3";

package cac.cache.v1;

option go_package = "github.com/kuasar-sandbox/accelerator/pkg/cache/pb";

service Info {
    // Get returns a point-in-time snapshot of the daemon's counters.
    // All counters are monotonically increasing over the daemon's
    // lifetime; clients compute deltas by subtracting successive
    // snapshots.
    rpc Get(InfoRequest) returns (InfoReply);
}

message InfoRequest {}

message InfoReply {
    // "local" | "shard" | "tiered" — determines which backend detail
    // fields are populated.
    string mode = 1;
    // Seconds since daemon start.
    int64  uptime_sec = 2;
    // Wire-handler counters. Always populated regardless of mode.
    ServerStats server = 3;
    // Tiered-mode cascade stats. Nil when mode != "tiered".
    TieredStats tiered = 4;
    // Top-level RocksDB CF properties. Populated in local/shard mode
    // (the daemon's primary rocks.Store); nil in tiered mode because
    // tiered has no single top-level rocks — per-tier rocks properties
    // appear inside TieredStats.tiers[].rocks instead.
    repeated RocksCFStats rocks = 5;
    // Direct local/shard backend discriminator and Redis detail.
    string     backend_type = 6;
    RedisStats redis        = 7;
}

// ServerStats is the daemon-as-server view. A single external RPC
// bumps exactly one of Hits/Misses (for Get/GetShard) or exactly one
// of Fills (for Fill/FillShard success). Distinct from the tier-level
// cascade counts where a single RPC may bump multiple tiers.
message ServerStats {
    uint64 hits   = 1;
    uint64 misses = 2;
    uint64 fills  = 3;
}

message TieredStats {
    repeated TierStats tiers = 1;
    OriginStats        origin = 2;
}

// TierStats is one tier's cascade-view counts. Hits = CacheHit +
// CacheHitMiss (the tier answered); Misses = CacheMiss (punt to next);
// Errors = tryTier returned a non-nil err (wire failure, decode error,
// etc.) — distinct from Miss so "peer said no" is not conflated with
// "we failed to ask". Fills = number of fill-aside ops initiated on
// this tier.
//
// Exactly one of rocks/redis/peers/endpoint is populated, per Type:
//   - "embedded": rocks
//   - "redis":    redis
//   - "ec":       peers
//   - "upstream": endpoint
message TierStats {
    string type   = 1;
    uint64 hits   = 2;
    uint64 misses = 3;
    uint64 fills  = 4;

    repeated RocksCFStats rocks    = 5;
    repeated PeerStats    peers    = 6;
    string                endpoint = 7;
    uint64                errors   = 8;
    RedisStats            redis    = 9;
}

// OriginStats is the final cascade layer. Origin is a Getter (no
// Fill), so no Fills field. Errors mirrors TierStats.Errors.
message OriginStats {
    string type   = 1;
    uint64 hits   = 2;
    uint64 misses = 3;

    string store_path = 4;
    string endpoint   = 5;
    uint64 errors     = 6;
}

// PeerStats is per-EC-peer counts. Distinct from tier-level hits
// (which require ≥ dataShards peers to answer for a tier hit); each
// PeerStats row counts the individual peer's shard-level responses.
//
// Misses counts only peer-confirmed StatusMiss replies. Errors counts
// wire/pool failures plus StatusError replies — keeping these separate
// stops transport noise from inflating "cache miss rate". Cancelled
// counts StatusCancelled replies (e.g., after EC.Get early-exits with
// enough hits and cancels the straggler shard fetch). Fills captures
// per-peer write distribution (Maglev should be approximately uniform;
// large deviations indicate routing issues or single-peer write
// failures).
message PeerStats {
    string id        = 1;
    string endpoint  = 2;
    uint64 hits      = 3;
    uint64 misses    = 4;
    uint64 fills     = 5;
    uint64 errors    = 6;
    uint64 cancelled = 7;
}

// RocksCFStats mirrors rocks.CFStats. All numeric fields are strings
// because that is how RocksDB's GetProperty returns them — we avoid
// lossy conversion in the daemon and let consumers parse if they want.
message RocksCFStats {
    string name       = 1;
    string num_keys   = 2;
    string disk_usage = 3;
    string mem_usage  = 4;
}

message RedisStats {
    string endpoint = 1;

    int64 get_pool_size  = 2;
    int64 set_pool_size  = 3;
    int64 get_connected  = 4;
    int64 set_connected  = 5;
    int64 get_inflight   = 6;
    int64 set_inflight   = 7;
    int64 pool_waiters   = 8;
    int64 draining       = 9;

    uint64 get_hits           = 10;
    uint64 get_misses         = 11;
    uint64 sets               = 12;
    uint64 cancelled          = 13;
    uint64 late_bytes_drained = 14;
    uint64 reconnects         = 15;
    uint64 protocol_errors    = 16;
    uint64 backend_errors     = 17;

    uint64 get_p50_ns       = 18;
    uint64 get_p99_ns       = 19;
    uint64 get_p999_ns      = 20;
    uint64 set_p50_ns       = 21;
    uint64 set_p99_ns       = 22;
    uint64 set_p999_ns      = 23;
    uint64 pool_wait_p99_ns = 24;
    string transport        = 25;
}
