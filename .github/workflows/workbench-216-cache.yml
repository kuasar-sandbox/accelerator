name: Workbench 216 Accelerator Cache
run-name: Workbench 216 accelerator trusted cache ${{ github.sha }}
# Temporary nonpublishing acceptance entry; delete with its evidence helper
# after #216 validates the saved cache and fresh-Job package comparison.
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: workbench-216-accelerator-cache
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'kuasar-sandbox/accelerator' && github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
      framework_sha: ${{ steps.freeze.outputs.framework_sha }}
    steps:
      - name: Check out this workflow's admitted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: trusted/accelerator
          persist-credentials: false
      - name: Resolve the current main framework once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: main
          path: trusted/platform
          persist-credentials: false
      - name: Freeze exact main source, framework and published native images
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: python3 -B trusted/accelerator/scripts/verify-workbench-216-cache.py freeze --plan cache-plan
      - name: Preserve the single selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accelerator-cache-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-plan
          if-no-files-found: error
          retention-days: 7

  cold-x86:
    if: github.repository == 'kuasar-sandbox/accelerator' && github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.ref == 'refs/heads/main'
    needs: [prepare]
    name: cold (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out this workflow's fixed host tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: trusted/accelerator
          persist-credentials: false
      - name: Check out the frozen framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.prepare.outputs.framework_sha }}
          path: trusted/platform
          persist-credentials: false
      - name: Download the single selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accelerator-cache-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-plan
      - name: Check out a fresh exact component source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: src/accelerator
          persist-credentials: false
      - name: Check CI regression contracts
        run: python3 trusted/accelerator/scripts/ci-test-workflows.py trusted/platform
      - name: Build, test and validate the original accelerator release package
        uses: ./trusted/platform/.github/actions/workbench
        with:
          selection: cache-plan/workbench.json
          sources: src
          cache-coverage: release-accelerator-build
          outputs: |
            accelerator/release-bundle
            accelerator/bin
          arch: x86_64
          cpus: '2'
          memory-gib: '8'
          run: |
            set -euo pipefail
            umask 022
            bash /inputs/release/ci/native-cache/native-cache.sh restore-or-build rocksdb
            cd accelerator
            if [ "$TARGET_ARCH" = x86_64 ]; then make test; make vet; fi
            make build
            if [ "$TARGET_ARCH" = x86_64 ]; then make test-release; fi
            VERSION=v0.0.0
            [ "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}" ]
            export SOURCE_DATE_EPOCH
            SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ needs.prepare.outputs.source_sha }}")
            bash scripts/release.sh package "$VERSION" "$TARGET_ARCH" release-bundle
            bash scripts/release.sh validate "$VERSION" "$TARGET_ARCH" release-bundle
      - name: Check the released accelerator ABI
        run: python3 trusted/accelerator/scripts/ci-check-abi.py src/accelerator/bin/x86_64
      - name: Verify cleaned receipts, trusted cache and package hashes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -B trusted/accelerator/scripts/verify-workbench-216-cache.py record \
            --plan cache-plan --phase cold --arch "x86_64" \
            --output cache-evidence
      - name: Preserve the actual cache result, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accelerator-cache-cold-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-evidence
          if-no-files-found: error
          retention-days: 7

  cold-arm:
