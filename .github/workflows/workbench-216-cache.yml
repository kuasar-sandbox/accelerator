  warm-arm:
    if: always() && needs.prepare.result == 'success' && !cancelled() && github.repository == 'kuasar-sandbox/accelerator' && github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.ref == 'refs/heads/main'
    needs: [prepare, cold-arm]
